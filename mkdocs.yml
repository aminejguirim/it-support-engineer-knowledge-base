site_name: IT Support Engineer – Knowledge Base
site_description: Documentation technique en support informatique, systèmes, réseaux et cybersécurité
site_author: Amine Jeguirim
repo_name: it-support-engineer-knowledge-base
repo_url: https://github.com/aminejguirim/it-support-engineer-knowledge-base
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Accueil: index.md
  - Parcours Microsoft IT Support:
      - Présentation: microsoft-it-support/index.md
      - 01 – Introduction à l'informatique: microsoft-it-support/01-introduction-informatique.md
  - Expérience professionnelle: experience/index.md
  - Projets & laboratoires: projects/index.md
